<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Sign Up - CV Sir</title>
  <meta name="view-transition" content="same-origin" />
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../uploads/cv-logo.png">
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body class="auth-body">
  <div class="auth-split-container">
    <!-- FORM AREA (LEFT) -->
    <div class="auth-left">
      <div class="auth-form-wrapper">
        <h2>Create an account</h2>
        <p class="subtitle">Join CV Sir and unlock your career potential.</p>

        <form id="signupForm" onsubmit="handleSignupSubmit(event)">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="authName" required placeholder="John Doe" />
          </div>
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="authEmail" required placeholder="name@company.com" />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="authPassword" required placeholder="Create a password" />
          </div>
          <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="authConfirmPassword" required placeholder="Confirm your password" />
          </div>

          <p id="authError" class="auth-error"></p>
          <button type="submit" id="authSubmitBtn">Create Account</button>
        </form>

        <p class="auth-switch">
          <span>Already have an account?</span>
          <a href="login.html">Log in</a>
        </p>
      </div>
    </div>

    <!-- VISUAL AREA (RIGHT) -->

    <div class="auth-right">
      <div class="branding-visual">
        <div class="branding-logo-wrapper">
          <div class="central-glow"></div>
          <img src="../uploads/CvSir%20Logo-%20file.png" alt="CV Sir Logo" class="branding-logo">

          <!-- Orbiting Rings -->
          <div class="orbit-ring ring-1"></div>
          <div class="orbit-ring ring-2"></div>

          <!-- Iconic Planets (Dual-Ring System) -->
          <div class="icon-orbit-container inner">
            <div class="icon-orbit icon-cv" title="CV / Resume">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
              </svg>
            </div>
            <div class="icon-orbit icon-ai" title="AI Assistant">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"></path>
                <path d="M12 6V2"></path>
                <path d="M12 22v-4"></path>
                <path d="M18.36 5.64l-2.83 2.83"></path>
                <path d="M8.47 15.53l-2.83 2.83"></path>
                <path d="M22 12h-4"></path>
                <path d="M6 12H2"></path>
                <path d="M18.36 18.36l-2.83-2.83"></path>
                <path d="M8.47 8.47L5.64 5.64"></path>
              </svg>
            </div>
            <div class="icon-orbit icon-rocket" title="Success / Launch">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.39 1.24-1.01 1.5-1.74l.76-2.1c.14-.38.4-.72.73-.94l4.74-3.16c.14-.09.25-.21.31-.35l2.1-4.7c.56-1.25.13-2.73-1-3.6s-2.71-.85-3.6-.13l-4.7 2.1c-.14.06-.26.17-.35.31L8.83 8.35c-.22.33-.56.59-.94.73l-2.1.76c-.73.26-1.35.79-1.74 1.5z">
                </path>
              </svg>
            </div>
          </div>

          <div class="icon-orbit-container outer">
            <div class="icon-orbit icon-job" title="Job / Career">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <div class="icon-orbit icon-growth" title="Growth / Scaling">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
              </svg>
            </div>
            <div class="icon-orbit icon-user" title="Profile / Identity">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="branding-text">
        <h2>Build your future with AI-powered CV tools.</h2>
        <p>Create, optimize, and land your dream job faster.</p>
      </div>
    </div>
  </div>
  </div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle Dark Mode">
    🌙
  </button>
  <script src="script.js"></script>

</body>

</html>
